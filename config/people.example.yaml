# Eine Person = ein Eintrag. Beliebig erweiterbar.

- name: "Schwester"
  email: "schwester@example.com"
  cv_path: "data/profiles/schwester_cv.pdf"
  survey_path: "data/profiles/schwester_survey.json"
  min_score: 70          # nur Jobs ab diesem Match-Score werden verschickt
  include_maybe_zone: false   # true = auch 50-69 Punkte als "vielleicht" mitschicken
  search:
    was: "Projektmanagement"      # Freitext Jobtitel/Suchbegriff
    wo: "München"                 # Ort
    umkreis_km: 40
    arbeitszeit: ["vollzeit", "teilzeit"]
  # Optional: geräteübergreifende Synchronisation der "interessant"/"ausblenden"-
  # Markierungen auf der GitHub-Pages-Seite dieser Person, siehe sheets-backend/SETUP.md.
  # Ohne diese beiden Zeilen bleiben Markierungen nur im Browser der Person.
  # sheets_sync_url: "https://script.google.com/macros/s/.../exec"
  # sheets_sync_token: "eigenes-langes-zufalls-secret"

- name: "Frau"
  email: "frau@example.com"
  cv_path: "data/profiles/frau_cv.pdf"
  survey_path: "data/profiles/frau_survey.json"
  min_score: 65
  include_maybe_zone: true      # bei Richtungswechsel bewusst breiter suchen
  search:
    was: ""                       # leer lassen bei offener Richtungswechsel-Suche
    wo: "Köln"
    umkreis_km: 50
    arbeitszeit: ["vollzeit"]
