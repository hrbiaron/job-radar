<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job-Radar</title>
<style>
  :root { --bg: #f7f7f5; --text: #1a1a1a; --text-muted: #6b6b6b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1c1b1a; --text: #ebe9e6; --text-muted: #a3a09b; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    text-align: center; padding: 24px;
  }
  p { color: var(--text-muted); }
</style>
</head>
<body>
  <div>
    <h1>🧭 Job-Radar</h1>
    <p>Diese Seite dient nur als Platzhalter. Die eigentlichen Job-Übersichten<br>
       findest du unter deinem persönlichen Link (per E-Mail zugeschickt).</p>
  </div>
</body>
</html>
